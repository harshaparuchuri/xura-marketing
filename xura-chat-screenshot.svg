<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 720" fill="none">
  <rect width="375" height="720" rx="0" fill="#060E09"/>
  <!-- status bar -->
  <text x="24" y="44" fill="#8a9b8e" font-family="sans-serif" font-size="13" font-weight="500">9:41</text>
  <text x="330" y="44" fill="#8a9b8e" font-family="sans-serif" font-size="13">100%</text>
  <!-- header -->
  <rect x="0" y="56" width="375" height="56" fill="#0a1a10"/>
  <circle cx="44" cy="84" r="16" fill="#0C3B2E"/>
  <rect x="34" y="76" width="20" height="16" rx="5" fill="#1a3a28"/>
  <circle cx="40" cy="82" r="3" fill="#e8f0e2"/>
  <circle cx="48" cy="82" r="3" fill="#e8f0e2"/>
  <text x="72" y="80" fill="#e8f0e2" font-family="sans-serif" font-size="16" font-weight="600">Xura AI</text>
  <text x="72" y="96" fill="#6b8a72" font-family="sans-serif" font-size="12">Online · Ready to help</text>
  <!-- user message -->
  <rect x="80" y="140" width="275" height="52" rx="18" fill="#1a5a32"/>
  <text x="100" y="163" fill="#e8f0e2" font-family="sans-serif" font-size="14">Show me Q2 pipeline by stage</text>
  <text x="100" y="180" fill="#6b8a72" font-family="sans-serif" font-size="11">2:34 PM</text>
  <!-- ai response -->
  <rect x="20" y="210" width="300" height="24" rx="12" fill="#0f2618"/>
  <text x="36" y="226" fill="#8aab72" font-family="sans-serif" font-size="12">⚡ Worked for 12s · 3 sources</text>
  <rect x="20" y="246" width="300" height="220" rx="16" fill="#0f2618" stroke="#1a3a28" stroke-width="1"/>
  <text x="36" y="274" fill="#c8d8c0" font-family="sans-serif" font-size="14" font-weight="600">Q2 Pipeline Summary</text>
  <!-- chart bars -->
  <rect x="36" y="296" width="180" height="18" rx="4" fill="#2a6a3e"/>
  <text x="44" y="310" fill="#e8f0e2" font-family="sans-serif" font-size="11">Discovery · $2.4M</text>
  <rect x="36" y="322" width="140" height="18" rx="4" fill="#1a5a32"/>
  <text x="44" y="336" fill="#e8f0e2" font-family="sans-serif" font-size="11">Proposal · $1.8M</text>
  <rect x="36" y="348" width="100" height="18" rx="4" fill="#0C3B2E"/>
  <text x="44" y="362" fill="#e8f0e2" font-family="sans-serif" font-size="11">Negotiation · $960K</text>
  <rect x="36" y="374" width="60" height="18" rx="4" fill="#C8F135" opacity="0.3"/>
  <text x="44" y="388" fill="#C8F135" font-family="sans-serif" font-size="11" font-weight="600">Closed · $540K</text>
  <text x="36" y="420" fill="#8aab72" font-family="sans-serif" font-size="12">Total pipeline: $5.7M</text>
  <text x="36" y="438" fill="#8aab72" font-family="sans-serif" font-size="12">Win rate: 23% (↑4% vs Q1)</text>
  <text x="36" y="456" fill="#6b8a72" font-family="sans-serif" font-size="11">Sources: Salesforce, HubSpot, Sheets</text>
  <!-- action buttons -->
  <rect x="20" y="480" width="155" height="36" rx="10" fill="#0f2618" stroke="#1a3a28" stroke-width="1"/>
  <text x="38" y="503" fill="#C8F135" font-family="sans-serif" font-size="12" font-weight="500">📊 Share dashboard</text>
  <rect x="185" y="480" width="135" height="36" rx="10" fill="#0f2618" stroke="#1a3a28" stroke-width="1"/>
  <text x="203" y="503" fill="#C8F135" font-family="sans-serif" font-size="12" font-weight="500">📧 Email report</text>
  <!-- second user message -->
  <rect x="120" y="540" width="235" height="44" rx="18" fill="#1a5a32"/>
  <text x="140" y="566" fill="#e8f0e2" font-family="sans-serif" font-size="14">Alert me if any deal stalls</text>
  <!-- ai typing -->
  <rect x="20" y="600" width="120" height="36" rx="18" fill="#0f2618"/>
  <circle cx="48" cy="618" r="4" fill="#8aab72" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="618" r="4" fill="#8aab72" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="618" r="4" fill="#8aab72" opacity="0.4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <!-- input bar -->
  <rect x="0" y="668" width="375" height="52" fill="#0a1a10"/>
  <rect x="16" y="678" width="300" height="36" rx="18" fill="#0f2618" stroke="#1a3a28" stroke-width="1"/>
  <text x="36" y="700" fill="#4a6a52" font-family="sans-serif" font-size="14">Ask Xura anything...</text>
  <circle cx="340" cy="696" r="16" fill="#C8F135"/>
  <text x="334" y="701" fill="#060E09" font-family="sans-serif" font-size="16" font-weight="700">↑</text>
</svg>